<body>
<title>Entrada Check-In</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen app, sticky title bar, scrolling view, fixed iOS-style tab bar. */
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --fg:#1C2A31; --muted:#5E6F76; --line:#D3DDDA; --soft:#E2ECE8;
  --accent:#D9553B; --accent-ink:#FFFFFF;
  --ok:#2D8A58; --ok-soft:#DDF1E5; --warn:#B8780C; --warn-soft:#FBEFD2; --crit:#C23B2A; --crit-soft:#F9DEDA; --info:#2B6CB0; --info-soft:#DCE9F7;
  --display:'Nunito',"Avenir Next",system-ui,sans-serif;
  --body:'IBM Plex Sans',-apple-system,"Segoe UI",system-ui,sans-serif;
  --radius:14px; --tabh:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131B1F; --surface:#1C262B; --fg:#E9F0EE; --muted:#9DAEB3; --line:#2E3B41; --soft:#243036;
  --accent:#F07A60; --accent-ink:#1A0E0B;
  --ok:#5BC98A; --ok-soft:#1E3A2C; --warn:#E5A83B; --warn-soft:#3B2F14; --crit:#EF6F5F; --crit-soft:#3F1F1B; --info:#6FA8E8; --info-soft:#1D2F44;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#131B1F; --surface:#1C262B; --fg:#E9F0EE; --muted:#9DAEB3; --line:#2E3B41; --soft:#243036;
  --accent:#F07A60; --accent-ink:#1A0E0B;
  --ok:#5BC98A; --ok-soft:#1E3A2C; --warn:#E5A83B; --warn-soft:#3B2F14; --crit:#EF6F5F; --crit-soft:#3F1F1B; --info:#6FA8E8; --info-soft:#1D2F44;
  color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:72px;resize:vertical}
.num{font-variant-numeric:tabular-nums}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;flex:none}
.brand h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500;font-family:var(--body)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.helpbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font:800 20px/1 var(--display);flex:none;cursor:pointer}
.help{display:flex;flex-direction:column;gap:14px}
.help section{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--bg)}
.help h4{margin:0 0 8px;font-family:var(--display);font-size:17px}
.help ol,.help ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15.5px;line-height:1.45}
.help .tip{font-size:14px;color:var(--muted);margin-top:8px}
.help .links a{word-break:break-all}
.help b{font-weight:700}
.lang button{background:none;border:0;padding:6px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

main{padding-block:16px calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 16px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  max-width:860px;margin:0 auto}
.view{display:flex;flex-direction:column;gap:16px}
.view h2{font-size:24px}
.sub{color:var(--muted);font-size:14px;margin:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.grow{flex:1;min-width:0}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.tile .v{font-family:var(--display);font-weight:800;font-size:28px;line-height:1}
.tile .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:6px;font-weight:600}
.tile.ok .v{color:var(--ok)} .tile.warn .v{color:var(--warn)} .tile.crit .v{color:var(--crit)} .tile.info .v{color:var(--info)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.card h3{font-size:16px;margin-bottom:8px}
.banner{background:var(--warn-soft);border:1px solid var(--warn);color:var(--fg);border-radius:12px;padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;gap:12px;align-items:center}
.item.tap{cursor:pointer}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:14px;flex:none;color:var(--fg)}
.avatar.in{background:var(--ok-soft);color:var(--ok)} .avatar.out{background:var(--info-soft);color:var(--info)} .avatar.absent{background:var(--crit-soft);color:var(--crit)}
.item .name{font-weight:600}
.item .meta{font-size:13px;color:var(--muted)}
.item .actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.in{background:var(--ok-soft);color:var(--ok)} .pill.out{background:var(--info-soft);color:var(--info)} .pill.absent{background:var(--crit-soft);color:var(--crit)} .pill.qr{background:var(--warn-soft);color:var(--warn)}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--fg);margin:2px 4px 0 0}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.sm{padding:6px 10px;font-size:13px}
button,label.btn,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (pointer:coarse){.btn{min-height:44px}.btn.sm{min-height:40px;padding:8px 12px;font-size:14px}.item .actions .btn{min-width:88px;justify-content:center}}
html{overscroll-behavior-y:none}
.btn.block{width:100%;justify-content:center;padding:13px}
.btn:disabled{opacity:.5;cursor:default}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.contact{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.contact .full{grid-column:1/-1}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:auto}
.radio{display:flex;flex-direction:column;gap:6px}
.radio label{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.radio input{width:auto}
.radio label:has(input:checked){border-color:var(--accent);background:var(--soft)}

/* Scanner */
.sheet .scanbox{aspect-ratio:16/10}
.scanbox{position:relative;background:#000;border-radius:var(--radius);overflow:hidden;aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;color:#fff}
.scanbox video{width:100%;height:100%;object-fit:cover}
.scanbox .frame{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:16px;pointer-events:none}
.scanbox .idle{text-align:center;padding:20px;font-size:14px;color:#cfd8d6}
.result{display:flex;flex-direction:column;gap:10px}

/* QR cards */
.qrcard{background:var(--surface);border:2px solid var(--fg);border-radius:16px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;max-width:320px;margin:0 auto}
.qrcard .qr{background:#fff;padding:10px;border-radius:10px}
.qrcard .qr img,.qrcard .qr canvas{display:block;max-width:100%}
.qrcard .cn{font-family:var(--display);font-weight:800;font-size:20px}
.qrcard .org{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.qrcard .tok{font-size:11px;color:var(--muted);word-break:break-all;font-family:ui-monospace,Menlo,monospace}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.qrgrid .qrcard{max-width:none}

/* Log */
.daynav{display:flex;align-items:center;gap:8px}
.daynav input{flex:1}
.entry{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.entry:first-of-type{border-top:0}
.entry .t{font-family:var(--display);font-weight:800;font-size:17px}
.entry .who{font-size:13px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tablewrap{overflow-x:auto}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  display:flex;height:calc(var(--tabh) + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 2px}
.tabbar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--accent)}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,20,24,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;
  padding-block:14px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.backdrop{align-items:center}.sheet{border-radius:18px;max-height:88vh}}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet h3{font-size:19px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 12px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.sigpad{position:relative;border:2px dashed var(--line);border-radius:12px;background:#fff;overflow:hidden;touch-action:none;width:fit-content;max-width:100%}
.sigpad canvas{display:block;touch-action:none;cursor:crosshair}
.sig-hint{position:absolute;left:0;right:0;top:44%;text-align:center;color:var(--muted);font-size:14px;pointer-events:none}
.sig-x{position:absolute;left:12px;bottom:22px;color:var(--muted);font-size:14px;pointer-events:none}
.sig-line{position:absolute;left:30px;right:16px;bottom:28px;border-bottom:1.5px solid var(--line);pointer-events:none}
.paper{background:#fff;color:#1E1E28;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.paper-title{font-family:Georgia,'Times New Roman',serif;font-weight:900;color:#1F68B0;font-size:22px;text-align:center;letter-spacing:.02em}
.paper-meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:Georgia,serif;font-weight:700;color:#1F68B0;margin:10px 0}
.paper-meta u{color:#1E1E28;font-weight:400;text-decoration-color:#1F68B0;padding:0 6px}
.paper-t{border-collapse:collapse;width:100%;font-family:Georgia,serif;font-size:13px;min-width:520px}
.paper-t th,.paper-t td{border:1px solid #8A8A96;padding:3px 6px;height:30px;text-align:left;vertical-align:middle}
.paper-t th{font-size:11px;text-align:center}
.paper-t tr.gap td{border:0;height:10px;padding:0}
.paper-t td.abs{color:#8A8A96;font-style:italic}
.paper-t .sigimg{height:24px;width:100%;max-width:170px;display:block}
.paper-t .typed{font-style:italic}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre;overflow:auto;background:var(--soft);padding:10px;border-radius:10px;max-height:40vh}
.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<header class="topbar">
  <div class="brand"><div class="mark">E</div><div><h1 id="orgTitle">Entrada</h1><small id="todayLabel"></small></div></div>

  <button data-tab="more"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.5"/><circle cx="5" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg><span data-t="more"></span></button>
</nav>

const t=(k,v)=>{let s=(STR[state.settings.lang]||STR.es)[k]||k; if(v) for(const n in v) s=s.replace('{'+n+'}',v[n]); return s;};
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const locale=()=>state.settings.lang==='en'?'en-US':'es-MX';
const pad=n=>String(n).padStart(2,'0');
const dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey=()=>dateKey(new Date());
const fromKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const fmtDate=k=>fromKey(k).toLocaleDateString(locale(),{weekday:'long',month:'long',day:'numeric',year:'numeric'});
const fmtTime=iso=>iso?new Date(iso).toLocaleTimeString(locale(),{hour:'numeric',minute:'2-digit'}):'—';
const toHHMM=iso=>{const d=new Date(iso);return pad(d.getHours())+':'+pad(d.getMinutes());};
const combine=(key,hhmm)=>{const d=fromKey(key);const [h,m]=hhmm.split(':').map(Number);d.setHours(h,m,0,0);return d.toISOString();};
const hoursBetween=(a,b)=>(a&&b)?Math.max(0,(new Date(b)-new Date(a))/36e5):0;
function ageText(dob){ if(!dob) return ''; const b=new Date(dob+'T00:00:00'),n=new Date(); let y=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth(); if(n.getDate()<b.getDate())m--; if(m<0){y--;m+=12;} return `${y}${t('yr')} ${m}${t('mo')}`; }
const fullName=c=>`${c.last}, ${c.first}`;
const initials=c=>((c.first[0]||'')+(c.last[0]||'')).toUpperCase();

/* ---------- state ---------- */
let state=load();
function blank(){return {version:1,settings:{lang:'es',org:''},children:[],log:[]};}
function load(){ try{const s=localStorage.getItem(LS_KEY); if(s){const o=JSON.parse(s); if(o&&o.children){ const st=Object.assign(blank(),o); if(st.settings&&st.settings.org==='Isabel Cardenas-Rico') st.settings.org="Chavelita's Child Care"; // first run after the real roster was added: replace sample-only data
  if(!st.rosterLoaded&&st.children.every(c=>c.sample)){ const r=seed(); r.settings.lang=st.settings.lang||r.settings.lang; return r; } return st; } } }catch(e){} return seed(); }
function save(){ try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){} }
function newToken(){ return 'ENTRADA-'+uid().toUpperCase()+'-'+Math.random().toString(36).slice(2,8).toUpperCase(); }
function seed(){ const s=blank(); s.rosterLoaded=true; return s; }

const childById=id=>state.children.find(c=>c.id===id);
const entriesFor=(childId,key)=>state.log.filter(e=>e.childId===childId&&e.date===key).sort((a,b)=>(a.inAt||'').localeCompare(b.inAt||''));
const openEntry=(childId,key)=>entriesFor(childId,key).find(e=>e.inAt&&!e.outAt);
function statusOf(childId,key){ const es=entriesFor(childId,key); if(es.some(e=>e.absent)) return 'absent'; if(es.some(e=>e.inAt&&!e.outAt)) return 'in'; if(es.some(e=>e.outAt)) return 'out'; return 'pending'; }

/* ---------- UI plumbing ---------- */
let tab='today', logDay=todayKey(), childFilter='', childActiveOnly=true, reportMode='month', reportFrom='', reportTo='';
function toast(msg){ const h=$('#toastHost'); h.innerHTML=`<div class="toast">${esc(msg)}</div>`; clearTimeout(toast.tm); toast.tm=setTimeout(()=>h.innerHTML='',1800); }
function sheet(html,onMount){ const host=$('#sheetHost'); host.innerHTML=`<div class="backdrop" id="backdrop"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $('#backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')closeSheet();}); host.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeSheet)); if(onMount) onMount(host); }
function closeSheet(){ $('#sheetHost').innerHTML=''; }
function confirmBox(msg,onYes){ sheet(`<header><h3>${esc(t('delete'))}</h3></header><p style="margin:0">${esc(msg)}</p><div class="row"><button class="btn danger grow" id="cYes">${esc(t('yes'))}</button><button class="btn grow" data-close>${esc(t('no'))}</button></div>`,h=>{$('#cYes',h).onclick=()=>{closeSheet();onYes();};}); }
let unlocked=false; const LOCKED=['children','log','more'];
function setTab(name){ if(LOCKED.includes(name)&&state.settings.pin&&!unlocked){ askPin(()=>{unlocked=true;setTab(name);}); return; } tab=name; document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!=='view-'+name); document.querySelectorAll('#tabbar button').forEach(b=>{ if(b.dataset.tab===name) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); }); if(location.hash!=='#'+name){try{history.replaceState(null,'','#'+name);}catch(e){}} render(); window.scrollTo(0,0); }
document.querySelectorAll('#tabbar button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1); if(['today','children','signs','log','more'].includes(h)&&h!==tab) setTab(h);});
$('#helpBtn').onclick=showHelp;
$('#langEs').onclick=()=>{state.settings.lang='es';save();render();};
$('#langEn').onclick=()=>{state.settings.lang='en';save();render();};

function askPin(onOk){ sheet(`<header><h3>${esc(t('enterPin'))}</h3><button class="btn sm" data-close>✕</button></header><input id="pinIn" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" style="font-size:28px;text-align:center;letter-spacing:.4em"><button class="btn block primary" id="pinGo">${esc(t('unlock'))}</button>`,h=>{ const i=$('#pinIn',h); i.focus(); const go=()=>{ if(i.value===state.settings.pin){ closeSheet(); onOk(); } else { toast(t('wrongPin')); i.value=''; i.focus(); } }; $('#pinGo',h).onclick=go; i.onkeydown=e=>{if(e.key==='Enter')go();}; }); }
function render(){
  $('#orgTitle').textContent=state.settings.org||'Entrada';
  $('#todayLabel').textContent=fmtDate(todayKey());
  $('#langEs').setAttribute('aria-pressed',state.settings.lang!=='en'); $('#langEn').setAttribute('aria-pressed',state.settings.lang==='en');
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  ({today:renderToday,children:renderChildren,signs:renderSigns,log:renderLog,more:renderMore})[tab]();
}
function sampleBanner(){ return state.children.some(c=>c.sample)?`<div class="banner"><span class="grow">${esc(t('sampleBanner'))}</span><button class="btn sm" id="clearSamples">${esc(t('clearSamples'))}</button></div>`:''; }
function bindSampleBanner(){ const b=$('#clearSamples'); if(b) b.onclick=()=>confirmBox(t('clearSamplesConfirm'),clearSamples); }
function clearSamples(){ const ids=new Set(state.children.filter(c=>c.sample).map(c=>c.id)); state.children=state.children.filter(c=>!ids.has(c.id)); state.log=state.log.filter(e=>!ids.has(e.childId)); save(); render(); toast(t('deleted')); }

/* ---------- TODAY ---------- */
function renderToday(){
  const tk=todayKey(); const active=state.children.filter(c=>c.status==='active').sort((a,b)=>fullName(a).localeCompare(fullName(b)));
  const st=active.map(c=>statusOf(c.id,tk)); const n=s=>st.filter(x=>x===s).length;
  const v=$('#view-today');
  const bk=state.settings.lastBackup, bkDays=bk?Math.floor((fromKey(tk)-fromKey(bk))/864e5):null;
  const welcome=!state.children.length?`<div class="card result"><h3>${esc(t('welcome'))}</h3><p class="sub">${esc(t('welcomeHint'))}</p><div class="row"><label class="btn primary grow" style="justify-content:center">⇧ ${esc(t('importJson'))}<input type="file" id="impWelcome" hidden></label><button class="btn grow" id="addFirst">+ ${esc(t('addChild'))}</button></div><button class="btn block" id="helpWelcome" style="margin-top:8px">? Instrucciones en español</button></div>`:'';
  const bkWarn=state.children.length&&bkDays!==null&&bkDays>=7?`<div class="banner">${esc(t('backupOld',{n:bkDays}))}</div>`:'';
  v.innerHTML=`${sampleBanner()}${welcome}${bkWarn}
  <div><h2>${esc(t('today'))}</h2><p class="sub">${esc(fmtDate(tk))}</p></div>${syncBar()}
  <div class="tiles">
    <div class="tile"><div class="v num">${active.length}</div><div class="k">${esc(t('enrolled'))}</div></div>
    <div class="tile ok"><div class="v num">${n('in')}</div><div class="k">${esc(t('inNow'))}</div></div>
    <div class="tile info"><div class="v num">${n('out')}</div><div class="k">${esc(t('wentHome'))}</div></div>
    <div class="tile crit"><div class="v num">${n('absent')}</div><div class="k">${esc(t('absent'))}</div></div>
    <div class="tile warn"><div class="v num">${n('pending')}</div><div class="k">${esc(t('notYet'))}</div></div>
  </div>
  <div class="list">${active.length?active.map(c=>{
    const s=statusOf(c.id,tk); const es=entriesFor(c.id,tk); const last=es[es.length-1];
    const meta=s==='in'?`${t('in')} ${fmtTime(last.inAt)} · ${esc(last.inBy||'')}`:s==='out'?`${t('in')} ${fmtTime(last.inAt)} → ${t('out')} ${fmtTime(last.outAt)} · ${esc(last.outBy||'')}`:s==='absent'?esc(t('absent')):esc(c.classroom||'');
    const pill=s==='in'?`<span class="pill in">${esc(t('present'))}</span>`:s==='out'?`<span class="pill out">${esc(t('gone'))}</span>`:s==='absent'?`<span class="pill absent">${esc(t('absent'))}</span>`:`<span class="pill">${esc(t('notYet'))}</span>`;
    const btns=s==='in'?`<button class="btn sm primary" data-out="${c.id}">${esc(t('checkOut'))}</button>`:s==='absent'?`<button class="btn sm" data-unabs="${c.id}">${esc(t('undoAbsent'))}</button>`:`<button class="btn sm ok" data-in="${c.id}">${esc(t('checkIn'))}</button>${s==='pending'?`<button class="btn sm" data-abs="${c.id}">${esc(t('markAbsent'))}</button>`:''}`;
    return `<div class="item"><div class="avatar ${s}">${esc(initials(c))}</div><div class="grow"><div class="name">${esc(fullName(c))} ${pill}</div><div class="meta">${meta}</div></div><div class="actions">${btns}</div></div>`;
  }).join(''):`<div class="empty">${esc(t('noActive'))}</div>`}</div>`;
  bindSampleBanner(); bindSyncBar(v);
  const iw=$('#impWelcome',v); if(iw) iw.onchange=e=>{ importBackupFile(e.target.files[0]); e.target.value=''; };
  const af=$('#addFirst',v); if(af) af.onclick=()=>editChild(null);
  const hw=$('#helpWelcome',v); if(hw) hw.onclick=showHelp;
  v.querySelectorAll('[data-in]').forEach(b=>b.onclick=()=>startCheck(b.dataset.in,'in'));
  v.querySelectorAll('[data-out]').forEach(b=>b.onclick=()=>startCheck(b.dataset.out,'out'));
  v.querySelectorAll('[data-abs]').forEach(b=>b.onclick=()=>{state.log.push({id:uid(),childId:b.dataset.abs,date:tk,inAt:null,outAt:null,inBy:'',outBy:'',inMethod:'',outMethod:'',absent:true,note:''});save();render();});
  v.querySelectorAll('[data-unabs]').forEach(b=>b.onclick=()=>{state.log=state.log.filter(e=>!(e.childId===b.dataset.unabs&&e.date===tk&&e.absent));save();render();});
}

/* ---------- SIGNATURES ----------
   A parent's finger signature is stored as a small SVG path ({w,h,d}) in IndexedDB under "<entryId>:in" or "<entryId>:out".
   IndexedDB is used instead of localStorage because a few months of signatures would outgrow localStorage. */
const sigs=(function(){
  let dbp=null; const mem=new Map();
  function open(){ if(dbp) return dbp; dbp=new Promise(res=>{ try{ const r=indexedDB.open('entrada-sigs',1); r.onupgradeneeded=()=>r.result.createObjectStore('s'); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); }catch(e){ res(null); } }); return dbp; }
  async function write(fn){ const db=await open(); if(!db){ fn(null); return; } await new Promise(res=>{ try{ const t=db.transaction('s','readwrite'); fn(t.objectStore('s')); t.oncomplete=res; t.onerror=res; t.onabort=res; }catch(e){ res(); } }); }
  return {
    put:(k,v)=>write(st=>st?st.put(v,k):mem.set(k,v)),
    del:(...ks)=>write(st=>ks.forEach(k=>st?st.delete(k):mem.delete(k))),
    clear:()=>write(st=>st?st.clear():mem.clear()),
    putAll:o=>write(st=>Object.keys(o||{}).forEach(k=>st?st.put(o[k],k):mem.set(k,o[k]))),
    all:async()=>{ const db=await open(); if(!db) return Object.fromEntries(mem); return new Promise(res=>{ const out={}; try{ const req=db.transaction('s','readonly').objectStore('s').openCursor(); req.onsuccess=()=>{ const c=req.result; if(c){ out[c.key]=c.value; c.continue(); } else res(out); }; req.onerror=()=>res(out); }catch(e){ res(out); } }); }
  };
})();
const validSig=g=>!!(g&&typeof g.d==='string'&&/^[MLl0-9 .\-]+$/.test(g.d)&&g.w>0&&g.h>0);
function sigSvg(g,cls){ if(!validSig(g)) return ''; return `<svg class="${cls||'sigimg'}" viewBox="${sigBox(g).join(' ')}" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><path d="${g.d}" fill="none" stroke="#1d2b6b" stroke-width="${Math.max(2,sigBox(g)[3]/26).toFixed(1)}" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
// tight box around the ink, so a small signature still fills its cell
function sigBox(g){ const n=(g.d.match(/-?\d+(\.\d+)?/g)||[]).map(Number); let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(let i=0;i+1<n.length;i+=2){ const x=n[i],y=n[i+1]; if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } if(x0>x1) return [0,0,g.w,g.h]; const m=6; return [x0-m,y0-m,Math.max(20,x1-x0+2*m),Math.max(12,y1-y0+2*m)]; }
function rdp(p,e){ if(p.length<3) return p; let dm=0,ix=0; const [x1,y1]=p[0],[x2,y2]=p[p.length-1]; const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1;
  for(let i=1;i<p.length-1;i++){ const d=Math.abs(dy*p[i][0]-dx*p[i][1]+x2*y1-y2*x1)/L; if(d>dm){dm=d;ix=i;} }
  if(dm>e){ const a=rdp(p.slice(0,ix+1),e), b=rdp(p.slice(ix),e); return a.slice(0,-1).concat(b); } return [p[0],p[p.length-1]]; }
function strokesToPath(strokes){ return strokes.map(st=>{ const q=st.length>2?rdp(st,.7):st; const r=q.map(([x,y])=>Math.round(x)+' '+Math.round(y)); return 'M'+r[0]+(r.length>1?'L'+r.slice(1).join(' '):' l0.5 0'); }).join(''); }
function sigPad(root){
  root.innerHTML=`<div class="sigpad"><canvas></canvas><span class="sig-hint">${esc(t('signHere'))}</span><span class="sig-x">✕</span><span class="sig-line"></span></div><div class="row" style="justify-content:flex-end;margin-top:6px"><button type="button" class="btn sm sig-clear">${esc(t('clearSig'))}</button></div>`;
  const cv=$('canvas',root), hint=$('.sig-hint',root), ctx=cv.getContext('2d');
  const W=Math.max(260,Math.min(560,Math.floor(root.clientWidth||320))), H=150, dpr=window.devicePixelRatio||1;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+'px'; cv.style.height=H+'px'; cv.setAttribute('aria-label',t('signTitle'));
  ctx.scale(dpr,dpr); ctx.lineWidth=2.6; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#1d2b6b';
  let strokes=[], cur=null;
  const pt=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]; };
  cv.addEventListener('pointerdown',e=>{ e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(_){} cur=[pt(e)]; strokes.push(cur); hint.hidden=true; ctx.beginPath(); ctx.moveTo(cur[0][0],cur[0][1]); ctx.lineTo(cur[0][0]+.1,cur[0][1]); ctx.stroke(); });
  cv.addEventListener('pointermove',e=>{ if(!cur) return; e.preventDefault(); const q=pt(e), l=cur[cur.length-1]; if(Math.abs(q[0]-l[0])+Math.abs(q[1]-l[1])<1.2) return; cur.push(q); ctx.beginPath(); ctx.moveTo(l[0],l[1]); ctx.lineTo(q[0],q[1]); ctx.stroke(); });
  const end=()=>{ cur=null; }; cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end); cv.addEventListener('pointerleave',end);
  $('.sig-clear',root).onclick=()=>{ strokes=[]; ctx.clearRect(0,0,W,H); hint.hidden=false; };
  return { empty:()=>!strokes.length, data:()=>({w:W,h:H,d:strokesToPath(strokes)}) };
}

/* Manual check-in / check-out by staff (corrections, parents without a phone).
   Normal sign-ins come from the wall signs via syncForm(). */
function startCheck(childId,kind){
  const c=childById(childId); if(!c) return; const tk=todayKey();
  if(kind==='auto') kind=openEntry(childId,tk)?'out':'in';
  const auth=c.contacts.filter(x=>x.authorized); const now=new Date();
  sheet(`<header><h3>${esc(kind==='in'?t('checkIn'):t('checkOut'))} · ${esc(c.first)} ${esc(c.last)}</h3><button class="btn sm" data-close>✕</button></header>
  ${c.allergies||c.meds?`<p class="sub">${c.allergies?'⚠ '+esc(t('allergies'))+': '+esc(c.allergies):''}${c.meds?(c.allergies?' · ':'')+esc(t('meds'))+': '+esc(c.meds):''}</p>`:''}
  <div class="field"><label>${esc(kind==='in'?t('whoDrop'):t('whoPick'))}</label>
    <div class="radio">${auth.map((x,i)=>`<label><input type="radio" name="who" value="${esc(x.name)}" ${i===0?'checked':''}><span>${esc(x.name)} <span style="color:var(--muted);font-size:13px">· ${esc(x.relation)}</span></span></label>`).join('')}
    <label><input type="radio" name="who" value="__other" ${auth.length?'':'checked'}><span>${esc(t('other'))}</span></label></div></div>
  <div class="field" id="otherWrap" ${auth.length?'hidden':''}><label>${esc(t('otherName'))}</label><input id="otherName" autocomplete="off"></div>
  <div class="field"><label>${esc(t('signTitle'))}</label><div id="sigWrap"></div></div>
  <div class="form"><div class="field"><label>${esc(t('time'))}</label><input type="time" id="ckTime" value="${pad(now.getHours())}:${pad(now.getMinutes())}"></div>
  <div class="field"><label>${esc(t('note'))}</label><input id="ckNote"></div></div>
  <button class="btn block ${kind==='in'?'ok':'primary'}" id="ckGo">${esc(kind==='in'?t('confirmIn'):t('confirmOut'))}</button>`,h=>{
    h.querySelectorAll('input[name=who]').forEach(r=>r.onchange=()=>{$('#otherWrap',h).hidden=h.querySelector('input[name=who]:checked').value!=='__other';});
    const padSig=sigPad($('#sigWrap',h));
    $('#ckGo',h).onclick=()=>{ let who=h.querySelector('input[name=who]:checked')?.value||''; if(who==='__other') who=$('#otherName',h).value.trim();
      const id=recordEvent(childId,kind,combine(tk,$('#ckTime',h).value||`${pad(now.getHours())}:${pad(now.getMinutes())}`),who,'manual',$('#ckNote',h).value.trim());
      if(id&&!padSig.empty()) sigs.put(id+':'+kind,padSig.data());
      save(); closeSheet(); render(); toast(kind==='in'?t('checkedIn'):t('checkedOut')); };
  });
}
/* Apply one sign-in or sign-out to the log. Used by staff entries and by form sync. */
function recordEvent(childId,kind,iso,who,method,note){
  const key=dateKey(new Date(iso));
  if(kind==='in'){ state.log=state.log.filter(e=>!(e.childId===childId&&e.date===key&&e.absent));
    const id=uid(); state.log.push({id,childId,date:key,inAt:iso,outAt:null,inBy:who,outBy:'',inMethod:method,outMethod:'',absent:false,note:note||''}); return id; }
  const open=state.log.filter(e=>e.childId===childId&&e.date===key&&e.inAt&&!e.outAt&&e.inAt<=iso).sort((a,b)=>b.inAt.localeCompare(a.inAt))[0];
  if(open){ open.outAt=iso; open.outBy=who; open.outMethod=method; if(note) open.note=(open.note?open.note+' · ':'')+note; return open.id; }
  const id=uid(); state.log.push({id,childId,date:key,inAt:null,outAt:iso,inBy:'',outBy:who,inMethod:'',outMethod:method,absent:false,note:note||''}); return id;
}

function renderChildren(){
  const v=$('#view-children'); const q=childFilter.toLowerCase();
  const list=state.children.filter(c=>(!childActiveOnly||c.status==='active')&&(fullName(c)+' '+c.first).toLowerCase().includes(q)).sort((a,b)=>fullName(a).localeCompare(fullName(b)));
  v.innerHTML=`<div class="row spread"><h2>${esc(t('children'))} <span class="pill num">${state.children.length}</span></h2><button class="btn primary" id="addChild">+ ${esc(t('addChild'))}</button></div>
  <div class="row"><input id="childSearch" class="grow" placeholder="${esc(t('search'))}" value="${esc(childFilter)}" autocomplete="off"><select id="childActive" style="width:auto"><option value="1" ${childActiveOnly?'selected':''}>${esc(t('activeOnly'))}</option><option value="0" ${childActiveOnly?'':'selected'}>${esc(t('allChildren'))}</option></select></div>
  <div class="list">${list.length?list.map(c=>`<div class="item tap" data-open="${c.id}"><div class="avatar">${esc(initials(c))}</div><div class="grow"><div class="name">${esc(fullName(c))} ${c.status!=='active'?`<span class="pill">${esc(t('inactive'))}</span>`:''} ${c.sample?`<span class="pill qr">${esc(t('sampleTag'))}</span>`:''}</div><div class="meta">${esc(c.dob||'')} ${c.dob?'('+ageText(c.dob)+')':''} ${c.classroom?'· '+esc(c.classroom):''}${c.allergies?' · ⚠ '+esc(c.allergies):''}</div></div><span style="color:var(--muted)">›</span></div>`).join(''):`<div class="empty">${esc(t('noChildren'))}</div>`}</div>`;
  $('#addChild',v).onclick=()=>editChild(null);
  $('#childSearch',v).oninput=e=>{childFilter=e.target.value;renderChildren();const i=$('#childSearch');i.focus();i.setSelectionRange(i.value.length,i.value.length);};
  $('#childActive',v).onchange=e=>{childActiveOnly=e.target.value==='1';renderChildren();};
  v.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>editChild(el.dataset.open));
}

  const c=id?childById(id):{id:uid(),first:'',last:'',dob:'',status:'active',classroom:'',allergies:'',meds:'',diet:'',notes:'',tags:[],contacts:[],qrToken:newToken()};

   <div class="field"><label>${esc(t('status'))}</label><select id="f-status"><option value="active" ${c.status==='active'?'selected':''}>${esc(t('active'))}</option><option value="inactive" ${c.status!=='active'?'selected':''}>${esc(t('inactive'))}</option></select></div>
   ${f('classroom','classroom')}${f('allergies','allergies')}${f('meds','meds')}${f('diet','diet')}
   <div class="field full"><label>${esc(t('tags'))}</label><input id="f-tags" value="${esc(c.tags.join(', '))}"></div>
   <div class="field full"><label>${esc(t('notes'))}</label><textarea id="f-notes">${esc(c.notes)}</textarea></div></div>
  <div class="row spread"><h3>${esc(t('contacts'))}</h3><button class="btn sm" id="addContact" type="button">+ ${esc(t('addContact'))}</button></div>
  <div class="list" id="contacts">${c.contacts.map(contactRow).join('')}</div>
  <div class="row">${id?`<button class="btn danger" id="delChild">${esc(t('deleteChild'))}</button>`:''}</div>
  <div class="row"><button class="btn primary grow" id="saveChild">${esc(t('save'))}</button><button class="btn grow" data-close>${esc(t('cancel'))}</button></div>`,h=>{

    bindDel();
    $('#addContact',h).onclick=()=>{cl.insertAdjacentHTML('beforeend',contactRow({id:uid(),name:'',relation:'',phone:'',email:'',authorized:true}));bindDel();cl.lastElementChild.querySelector('input').focus();};
    if(id){ $('#delChild',h).onclick=()=>confirmBox(t('deleteConfirm',{name:c.first+' '+c.last}),()=>{state.children=state.children.filter(x=>x.id!==id);sigs.del(...state.log.filter(e=>e.childId===id).flatMap(e=>[e.id+':in',e.id+':out']));state.log=state.log.filter(e=>e.childId!==id);save();render();toast(t('deleted'));}); }
    $('#saveChild',h).onclick=()=>{ const g=k=>$('#f-'+k,h).value.trim(); if(!g('first')||!g('last')){toast(t('required'));return;}
      Object.assign(c,{first:g('first'),last:g('last'),dob:g('dob'),status:$('#f-status',h).value,classroom:g('classroom'),allergies:g('allergies'),meds:g('meds'),diet:g('diet'),notes:$('#f-notes',h).value.trim(),tags:g('tags').split(',').map(s=>s.trim()).filter(Boolean)});
      c.contacts=[...cl.querySelectorAll('.contact')].map(el=>({id:el.dataset.cid,name:$('.c-name',el).value.trim(),relation:$('.c-rel',el).value.trim(),phone:$('.c-phone',el).value.trim(),email:$('.c-email',el).value.trim(),authorized:$('.c-auth',el).checked})).filter(x=>x.name);
      if(!id){delete c.sample;state.children.push(c);} else if(c.sample) delete c.sample;
      save(); closeSheet(); render(); toast(t('saved')); };
  });
}

/* ---------- WALL SIGNS + GOOGLE FORM SYNC ----------
   One Google Form ("Tipo", "Niño" checkboxes, "Su nombre", "Nota") feeds a Google Sheet.
   Two printed signs carry pre-filled form links (Tipo=Entrada / Tipo=Salida).
   syncForm() reads the sheet's published CSV (or an uploaded CSV), matches child names,
   and applies each response once (state.formSeen holds processed response keys). */
const FORM_DEFAULTS={inUrl:'',outUrl:'',csvUrl:''};
const formCfg=()=>{ if(!state.form) state.form={...FORM_DEFAULTS,lastSync:null}; else { if(!state.form.inUrl) state.form.inUrl=FORM_DEFAULTS.inUrl; if(!state.form.csvUrl) state.form.csvUrl=FORM_DEFAULTS.csvUrl; } return state.form; };
const deriveOut=u=>u?u.replace(/=Entrada(?=&|$)/i,'=Salida'):'';
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const formChildName=c=>`${c.first} ${c.last}`;
function parseCsv(text){ const rows=[]; let row=[],f='',q=false; text=text.replace(/^﻿/,'');
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=ch; }
    else if(ch==='"') q=true; else if(ch===','){row.push(f);f='';} else if(ch==='\n'){row.push(f);rows.push(row);row=[];f='';} else if(ch!=='\r') f+=ch; }
  if(f||row.length){row.push(f);rows.push(row);} return rows.filter(r=>r.some(x=>x.trim())); }
function parseStamp(s){ s=String(s).trim(); if(/^\d{4}-\d{2}-\d{2}/.test(s)){ const d=new Date(s.replace(' ','T')); return isNaN(d)?null:{d}; }
  const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})[ ,]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([ap]\.?\s*m\.?)?/i); if(!m) return null;
  let a=+m[1],b=+m[2],y=+m[3],h=+m[4]; const ap=m[7]?m[7].toLowerCase()[0]:''; if(ap==='p'&&h<12)h+=12; if(ap==='a'&&h===12)h=0;
  let dmy=false; if(a>12){ dmy=true; [a,b]=[b,a]; } return {d:new Date(y,a-1,b,h,+m[5],+(m[6]||0)),dmy}; }
function applyCsv(text){
  const rows=parseCsv(text); if(rows.length<2) return {added:0,unmatched:[],dmy:false};
  const head=rows[0].map(norm); const find=(...keys)=>head.findIndex(h=>keys.some(k=>h.includes(k)));
  let iT=find('marca temporal','timestamp'); if(iT<0) iT=0;
  let iType=find('tipo','type'); let iKid=find('nino','child','hijo','estudiante'); let iWho=find('su nombre','your name','nombre','name'); let iNote=find('nota','note');
  if(iType<0) iType=1; if(iKid<0) iKid=2; if(iWho<0||iWho===iKid) iWho=3; if(iNote<0) iNote=-1;
  const byName=new Map(); state.children.forEach(c=>{ byName.set(norm(formChildName(c)),c); byName.set(norm(c.last+' '+c.first),c); byName.set(norm(c.first),byName.has(norm(c.first))?null:c); });
  const seen=new Set(state.formSeen||[]); let added=0, dmy=false; const unmatched=new Set();
  const items=rows.slice(1).map(r=>({r,ts:parseStamp(r[iT]||'')})).filter(x=>x.ts).sort((a,b)=>a.ts.d-b.ts.d);
  for(const {r,ts} of items){ if(ts.dmy) dmy=true;
    const type=norm(r[iType]); const kind=/salida|out|sal/.test(type)?'out':/entrada|in|ent/.test(type)?'in':null; if(!kind) continue;
    const who=(r[iWho]||'').trim(); const note=iNote>=0?(r[iNote]||'').trim():'';
    (r[iKid]||'').split(/\s*,\s*/).filter(Boolean).forEach(name=>{ const key=[r[iT],kind,norm(name),norm(who)].join('|'); if(seen.has(key)) return;
      const c=byName.get(norm(name)); if(!c){ unmatched.add(name); return; }
      seen.add(key); recordEvent(c.id,kind,ts.d.toISOString(),who,'qr',note); added++; }); }
  state.formSeen=[...seen]; formCfg().lastSync=new Date().toISOString(); save();
  return {added,unmatched:[...unmatched],dmy};
}
let lastSyncResult=null, syncBusy=false;
async function syncForm(silent){
  const cfg=formCfg(); if(!cfg.csvUrl||syncBusy) return; syncBusy=true;
  const tryFetch=async u=>{ const res=await fetch(u,{cache:'no-store'}); if(!res.ok) throw new Error(res.status); return res.text(); };
  try{ let text;
    try{ text=await tryFetch(cfg.csvUrl+(cfg.csvUrl.includes('?')?'&':'?')+'_='+Date.now()); }
    catch(e1){ await new Promise(r=>setTimeout(r,1500)); text=await tryFetch(cfg.csvUrl); }   // one retry, plain URL
    lastSyncResult=applyCsv(text); if(!silent||lastSyncResult.added) toast(lastSyncResult.added?t('syncDone',{n:lastSyncResult.added}):t('syncNone'));
  }catch(err){ const blocked=!!(window.claude&&window.claude.use); if(!silent||blocked) lastSyncResult={error:blocked?'blocked':'fail'}; if(!silent) toast(t(blocked?'syncBlocked':'syncFail')); }
  finally{ syncBusy=false; if(tab!=='more') render(); }
}
function autoSync(){ if(formCfg().csvUrl&&!(window.claude&&window.claude.use)) syncForm(true); }
function syncBar(){ const cfg=formCfg(); if(!cfg.csvUrl&&!cfg.inUrl) return '';
  return `<div class="row spread card" style="padding:10px 14px"><span class="sub">${esc(t('lastSync'))}: ${cfg.lastSync?fmtTime(cfg.lastSync):esc(t('never'))}</span><span class="row"><button class="btn sm" id="syncNow">↻ ${esc(t('sync'))}</button><label class="btn sm">⇧ CSV<input type="file" id="csvUp" hidden></label></span></div>`; }
function bindSyncBar(root){ const s=$('#syncNow',root); if(s) s.onclick=()=>{ toast(t('syncing')); syncForm(false); }; const u=$('#csvUp',root); if(u) u.onchange=e=>{ const f=e.target.files[0]; if(!f) return; const fr=new FileReader(); fr.onload=()=>{ lastSyncResult=applyCsv(fr.result); toast(lastSyncResult.added?t('syncDone',{n:lastSyncResult.added}):t('syncNone')); render(); }; fr.readAsText(f); e.target.value=''; }; }
function syncWarnings(){ const r=lastSyncResult; if(!r) return ''; let h='';
  if(r.error) h+=`<div class="banner">${esc(t(r.error==='blocked'?'syncBlocked':'syncFail'))}</div>`;
  if(r.dmy) h+=`<div class="banner">${esc(t('badDate'))}</div>`;
  if(r.unmatched&&r.unmatched.length) h+=`<div class="banner"><span class="grow">${esc(t('unmatched'))}: ${r.unmatched.map(esc).join(', ')}</span></div>`; return h; }

  const big=kind==='in'?t('signIn'):t('signOut'), alt=kind==='in'?t('signInEn'):t('signOutEn');

async function exportSignsPdf(inUrl,outUrl){
  toast(t('preparing'));
  try{ await loadLib('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',()=>window.jspdf&&window.jspdf.jsPDF); }catch(err){ toast(t('exportFail')); return; }
  const doc=new window.jspdf.jsPDF({unit:'pt',format:'letter'}); const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight();
  const qrData=url=>{ const tmp=document.createElement('div'); new QRCode(tmp,{text:url,width:600,height:600,correctLevel:QRCode.CorrectLevel.M}); const cv=tmp.querySelector('canvas'); return cv.toDataURL('image/png'); };
  [['in',inUrl,[45,138,88]],['out',outUrl,[217,85,59]]].forEach(([kind,url,rgb],i)=>{ if(i) doc.addPage();
    doc.setFillColor(...rgb); doc.rect(0,0,W,150,'F'); doc.setTextColor(255); doc.setFont('helvetica','bold'); doc.setFontSize(72);
    doc.text(kind==='in'?'ENTRADA':'SALIDA',W/2,95,{align:'center'}); doc.setFontSize(26); doc.setFont('helvetica','normal'); doc.text(kind==='in'?'Sign in':'Sign out',W/2,130,{align:'center'});
    const s=340; doc.addImage(qrData(url),'PNG',(W-s)/2,190,s,s);
    doc.setTextColor(30); doc.setFontSize(18); doc.text('Escanea con la cámara de tu teléfono,',W/2,580,{align:'center'}); doc.text('marca a tu hijo y escribe tu nombre.',W/2,604,{align:'center'});
    doc.setTextColor(110); doc.setFontSize(14); doc.text('Scan with your phone camera, check your child and type your name.',W/2,636,{align:'center'});
    doc.setTextColor(30); doc.setFont('helvetica','bold'); doc.setFontSize(20); doc.text(state.settings.org||'',W/2,H-60,{align:'center'}); });
  offerFile('letreros-entrada-salida.pdf',doc.output('blob'),'application/pdf');
}

      e.inAt=i&&!e.absent?combine(e.date,i):null; e.outAt=o&&!e.absent?combine(e.date,o):null; e.inBy=$('#e-inby',h).value.trim(); e.outBy=$('#e-outby',h).value.trim(); e.note=$('#e-note',h).value.trim();

/* ---------- REPORTS (PDF · Excel · CSV) ---------- */
const byName=(a,b)=>fullName(a).localeCompare(fullName(b));
function reportRange(){ if(reportMode==='day') return [logDay,logDay]; if(reportMode==='custom'&&reportFrom&&reportTo) return reportFrom<=reportTo?[reportFrom,reportTo]:[reportTo,reportFrom]; const [y,m]=logDay.split('-'); const last=new Date(+y,+m,0).getDate(); return [`${y}-${m}-01`,`${y}-${m}-${pad(last)}`]; }
function daysBetween(from,to){ const out=[]; const d=fromKey(from), end=fromKey(to); while(d<=end&&out.length<400){ out.push(dateKey(d)); d.setDate(d.getDate()+1); } return out; }
const shortDate=k=>fromKey(k).toLocaleDateString(locale(),{day:'numeric',month:'short',year:'numeric'});
const rangeLabel=(a,b)=>a===b?fmtDate(a):`${shortDate(a)} – ${shortDate(b)}`;
const stLabel=st=>st==='in'?t('present'):st==='out'?t('gone'):st==='absent'?t('absent'):t('noRecord');
function buildReport(from,to){
  const days=daysBetween(from,to); const inRange=state.log.filter(e=>e.date>=from&&e.date<=to);
  const ids=new Set(state.children.filter(c=>c.status==='active').map(c=>c.id)); inRange.forEach(e=>ids.add(e.childId));
  const kids=[...ids].map(childById).filter(Boolean).sort(byName);
  const opDays=new Set(inRange.filter(e=>e.inAt||e.outAt).map(e=>e.date));
  const cell=(cid,day)=>{ const es=inRange.filter(e=>e.childId===cid&&e.date===day).sort((a,b)=>(a.inAt||'').localeCompare(b.inAt||''));
    const st=es.some(e=>e.absent)?'absent':es.some(e=>e.inAt&&!e.outAt)?'in':es.some(e=>e.inAt||e.outAt)?'out':'none'; return {es,st,hrs:es.reduce((a,e)=>a+hoursBetween(e.inAt,e.outAt),0)}; };
  const summary=kids.map(c=>{ let present=0,absent=0,none=0,hrs=0; days.forEach(d=>{ const x=cell(c.id,d); if(x.st==='absent') absent++; else if(x.st==='in'||x.st==='out') present++; else if(opDays.has(d)) none++; hrs+=x.hrs; }); return {c,present,absent,none,hrs}; });
  const detail=inRange.slice().sort((a,b)=>a.date.localeCompare(b.date)||fullName(childById(a.childId)||{first:'',last:''}).localeCompare(fullName(childById(b.childId)||{first:'',last:''}))||(a.inAt||'').localeCompare(b.inAt||'')).map(e=>({e,c:childById(e.childId)||{first:'?',last:''}}));
  return {from,to,days,kids,opDays,cell,summary,detail};
}
/* Tables as arrays of rows (shared by every format) */
function summaryRows(r){ return [[t('child'),t('presentDays'),t('absentDays'),t('noRecord'),t('hours')],...r.summary.map(s=>[fullName(s.c),s.present,s.absent,s.none,+s.hrs.toFixed(2)]),[t('total'),r.summary.reduce((a,s)=>a+s.present,0),r.summary.reduce((a,s)=>a+s.absent,0),r.summary.reduce((a,s)=>a+s.none,0),+r.summary.reduce((a,s)=>a+s.hrs,0).toFixed(2)]]; }
function rosterRows(r,day){ return [[t('child'),t('status'),t('inTime'),t('outTime'),t('hours'),t('droppedBy'),t('pickedBy'),t('method'),t('note')],...r.kids.map(c=>{ const x=r.cell(c.id,day); const e=x.es[x.es.length-1]; const ins=x.es.filter(e=>e.inAt).map(e=>toHHMM(e.inAt)).join(' / '), outs=x.es.filter(e=>e.outAt).map(e=>toHHMM(e.outAt)).join(' / ');
  return [fullName(c),stLabel(x.st)+(x.st==='in'&&day<todayKey()?' ('+t('missingOut')+')':''),ins,outs,x.hrs?+x.hrs.toFixed(2):'',x.es.map(e=>e.inBy).filter(Boolean).join(' / '),x.es.map(e=>e.outBy).filter(Boolean).join(' / '),[...new Set(x.es.flatMap(e=>[e.inMethod,e.outMethod]).filter(Boolean))].join('/'),x.es.map(e=>e.note).filter(Boolean).join(' · ')]; })]; }
function detailRows(r){ return [[t('date'),t('child'),t('inTime'),t('outTime'),t('hours'),t('droppedBy'),t('pickedBy'),t('method'),t('absent'),t('note')],...r.detail.map(({e,c})=>[e.date,fullName(c),e.inAt?toHHMM(e.inAt):'',e.outAt?toHHMM(e.outAt):'',e.inAt&&e.outAt?+hoursBetween(e.inAt,e.outAt).toFixed(2):'',e.inBy,e.outBy,[e.inMethod,e.outMethod].filter(Boolean).join('/'),e.absent?t('yes'):'',e.note])]; }
function gridRows(r){ const dayHead=r.days.map(k=>String(+k.slice(8))); return [[t('child'),...dayHead,t('hours')],...r.kids.map(c=>{ let tot=0; const cells=r.days.map(d=>{ const x=r.cell(c.id,d); tot+=x.hrs; return x.st==='absent'?'A':x.st==='none'?'':x.hrs?+x.hrs.toFixed(1):'P'; }); return [fullName(c),...cells,+tot.toFixed(1)]; })]; }
const reportName=r=>`${(state.settings.org||'entrada').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-')}-${r.from===r.to?r.from:r.from+'_'+r.to}`;

const libs={};
function loadLib(url,ready){ if(ready()) return Promise.resolve(); if(!libs[url]) libs[url]=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=url; s.onload=()=>res(); s.onerror=()=>{ delete libs[url]; rej(new Error('load '+url)); }; document.head.appendChild(s); }); return libs[url]; }

async function exportPdf(r){
  toast(t('preparing'));
  try{
    await loadLib('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',()=>window.jspdf&&window.jspdf.jsPDF);
    await loadLib('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js',()=>window.jspdf&&window.jspdf.jsPDF.API.autoTable);
  }catch(err){ toast(t('exportFail')); return; }
  const {jsPDF}=window.jspdf; const single=r.from===r.to; const doc=new jsPDF({orientation:single?'portrait':'landscape',unit:'pt',format:'letter'});
  const W=doc.internal.pageSize.getWidth(); const margin=40;
  const head={fillColor:[217,85,59],textColor:255,fontStyle:'bold'}; const styles={fontSize:8,cellPadding:3,overflow:'linebreak'};
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.text(state.settings.org||'Entrada',margin,48);
  doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.text(`${t('report')} · ${rangeLabel(r.from,r.to)}`,margin,66);
  doc.setFontSize(8); doc.setTextColor(110); doc.text(`${t('generated')}: ${new Date().toLocaleString(locale())}`,margin,80); doc.setTextColor(0);
  const table=(rows,startY,extra)=>{ doc.autoTable(Object.assign({head:[rows[0]],body:rows.slice(1),startY,margin:{left:margin,right:margin},styles,headStyles:head,theme:'grid'},extra||{})); return doc.lastAutoTable.finalY; };
  const section=(title,y)=>{ if(y>doc.internal.pageSize.getHeight()-120){ doc.addPage(); y=48; } doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text(title,margin,y+22); doc.setFont('helvetica','normal'); return y+30; };
  let y=section(t('summary'),84);
  y=table(summaryRows(r),y,{columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'},4:{halign:'right'}}});
  if(single){ y=section(t('roster'),y); y=table(rosterRows(r,r.from),y); }
  else { y=section(t('grid')+' · P = '+t('present')+' · A = '+t('absent')+' · '+t('hours'),y);
    const g=gridRows(r); const cs={0:{cellWidth:110}}; for(let i=1;i<g[0].length;i++) cs[i]={halign:'center',cellWidth:(W-2*margin-110-40)/r.days.length}; cs[g[0].length-1]={halign:'right',cellWidth:40};
    y=table(g,y,{styles:{fontSize:r.days.length>20?6:7,cellPadding:2},columnStyles:cs}); }
  if(r.detail.length){ y=section(t('detail'),y); table(detailRows(r),y,{columnStyles:{4:{halign:'right'}}}); }
  const pages=doc.internal.getNumberOfPages(); for(let p=1;p<=pages;p++){ doc.setPage(p); doc.setFontSize(8); doc.setTextColor(110); doc.text(`${p} / ${pages}`,W-margin,doc.internal.pageSize.getHeight()-20,{align:'right'}); }
  offerFile(reportName(r)+'.pdf',doc.output('blob'),'application/pdf');
}
async function exportXlsx(r){
  toast(t('preparing'));
  try{ await loadLib('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',()=>window.XLSX); }catch(err){ toast(t('exportFail')); return; }
  const wb=XLSX.utils.book_new(); const add=(rows,name,widths)=>{ const ws=XLSX.utils.aoa_to_sheet(rows); if(widths) ws['!cols']=widths.map(w=>({wch:w})); XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31)); };
  const title=[[state.settings.org||'Entrada'],[`${t('report')} · ${rangeLabel(r.from,r.to)}`],[`${t('generated')}: ${new Date().toLocaleString(locale())}`],[]];
  add([...title,...summaryRows(r)],t('summary'),[30,14,14,14,10]);
  if(r.from===r.to) add(rosterRows(r,r.from),t('roster'),[30,18,14,14,8,22,22,10,30]);
  else add(gridRows(r),t('grid'),[30,...r.days.map(()=>5),8]);
  add(detailRows(r),t('detail'),[12,30,10,10,8,22,22,10,8,30]);
  const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});

}
function csvCell(s){ s=String(s??''); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function exportCsv(r){ const rows=r.from===r.to?rosterRows(r,r.from):detailRows(r); offerFile(reportName(r)+'.csv','﻿'+rows.map(x=>x.map(csvCell).join(',')).join('\n'),'text/csv'); }

/* Hand a generated file to the user: the claude.ai download capability when the page runs as an
   artifact, a plain browser download when it runs as the standalone file. */
async function offerFile(name,data,mime){
  const isText=typeof data==='string'; const inArtifact=!!(window.claude&&window.claude.use);
  if(inArtifact){ let dl=null; try{ dl=await window.claude.use('downloads'); }catch(err){}
    if(dl){ try{ await dl.save({filename:name,data}); toast(t('fileReady')); return; }catch(err){ if(err&&err.code==='declined') return; } }
    if(!isText){ toast(t('downloadNA')); return; }
    sheet(`<header><h3>${esc(t('fileReady'))} · ${esc(name)}</h3><button class="btn sm" data-close>✕</button></header><p class="sub">${esc(t('fileHint'))}</p><div class="mono" id="fileText">${esc(data)}</div><button class="btn block" id="copyBtn">${esc(t('copy'))}</button>`,h=>{
      $('#copyBtn',h).onclick=()=>{ navigator.clipboard?.writeText(data).then(()=>toast(t('copied'))).catch(()=>{ const rg=document.createRange(); rg.selectNodeContents($('#fileText',h)); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(rg); }); }; });
    return; }
  const blob=isText?new Blob([data],{type:mime}):data;
  const plain=()=>{ try{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },4000); toast(t('fileReady')); }catch(err){ toast(t('exportFail')); } };
  let file=null; try{ file=new File([blob],name,{type:mime}); }catch(err){}
  const touch=!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
  if(touch&&file&&navigator.canShare&&navigator.canShare({files:[file]})){
    // navigator.share needs a fresh tap, so it runs from this sheet's button rather than after the async export
    sheet(`<header><h3>${esc(t('fileReady'))}</h3><button class="btn sm" data-close>✕</button></header><p class="sub" style="word-break:break-all">${esc(name)}</p><p class="sub">${esc(t('shareHint'))}</p><button class="btn primary block" id="shareBtn">${esc(t('shareSave'))}</button><button class="btn block" id="dlBtn">${esc(t('downloadFile'))}</button>`,h=>{
      $('#shareBtn',h).onclick=()=>{ navigator.share({files:[file],title:name}).then(()=>closeSheet()).catch(err=>{ if(err&&err.name==='AbortError') return; toast(t('exportFail')); }); };
      $('#dlBtn',h).onclick=()=>{ closeSheet(); plain(); }; });
    return; }
  plain();
}

function importBackupFile(f){ if(!f) return; const r=new FileReader(); r.onload=async()=>{ try{ const o=JSON.parse(r.result); if(!o||!Array.isArray(o.children)||!Array.isArray(o.log)) throw 0;
    const incoming=o.sigs&&typeof o.sigs==='object'?o.sigs:null; delete o.sigs; state=Object.assign(blank(),o); state.rosterLoaded=true;
    if(state.settings&&state.settings.org==='Isabel Cardenas-Rico') state.settings.org="Chavelita's Child Care";
    if(incoming){ const ok={}; Object.keys(incoming).forEach(k=>{ if(/^[\w-]+:(in|out)$/.test(k)&&validSig(incoming[k])) ok[k]=incoming[k]; }); await sigs.putAll(ok); }
    save(); render(); toast(t('importDone')); autoSync(); }catch(err){ toast(t('importBad')); } }; r.readAsText(f); }

/* ---------- SIGN-IN SHEETS (her paper form, digitized) ----------
   Her paper sheets cover 5 weeks, Monday to Friday: 07/06–08/07/2026, 08/10–09/11/2026, ...
   Periods are counted in 35-day steps from Monday 07/06/2026. The sheet itself stays in English, like the paper. */
const SHEET_ANCHOR='2026-07-06';
const MONTHS_EN=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
function periodOf(key){ return Math.floor(Math.round((fromKey(key)-fromKey(SHEET_ANCHOR))/864e5)/35); }
function periodDays(k){ const s=fromKey(SHEET_ANCHOR); s.setDate(s.getDate()+35*k); const weeks=[]; for(let w=0;w<5;w++){ const wk=[]; for(let i=0;i<5;i++){ const d=new Date(s); d.setDate(s.getDate()+w*7+i); wk.push(dateKey(d)); } weeks.push(wk); } return weeks; }
function periodLabel(k){ const w=periodDays(k), a=fromKey(w[0][0]), b=fromKey(w[4][4]);
  if(a.getFullYear()!==b.getFullYear()) return `${MONTHS_EN[a.getMonth()]} ${a.getFullYear()} – ${MONTHS_EN[b.getMonth()]} ${b.getFullYear()}`;
  return a.getMonth()===b.getMonth()?`${MONTHS_EN[a.getMonth()]} ${b.getFullYear()}`:`${MONTHS_EN[a.getMonth()]} – ${MONTHS_EN[b.getMonth()]} ${b.getFullYear()}`; }
const shortMD=k=>k.slice(5,7)+'/'+k.slice(8,10);
let sheetPeriod=periodOf(todayKey()), sheetKid='__all';
function sheetPeriods(){ const now=periodOf(todayKey()); const first=Math.min(now-1, ...state.log.map(e=>periodOf(e.date))); const out=[]; for(let k=now+1;k>=Math.max(first,now-24);k--) out.push(k); return out; }
const tShort=iso=>{ const d=new Date(iso); let h=d.getHours(); const ap=h<12?'AM':'PM'; h=h%12||12; return h+':'+pad(d.getMinutes())+' '+ap; };
// one row per weekday: first check-in and last check-out of the day, with who signed and how
function sheetRows(childId,k,allSigs){
  return periodDays(k).map(week=>week.map(day=>{
    const es=entriesFor(childId,day);
    if(es.some(e=>e.absent)) return {day,absent:true};
    const ins=es.filter(e=>e.inAt).sort((a,b)=>a.inAt.localeCompare(b.inAt)), outs=es.filter(e=>e.outAt).sort((a,b)=>a.outAt.localeCompare(b.outAt));
    const fi=ins[0], lo=outs[outs.length-1];
    return {day,
      inT:fi?tShort(fi.inAt):'', inBy:fi?fi.inBy:'', inQr:!!(fi&&fi.inMethod==='qr'), inSig:fi?allSigs[fi.id+':in']:null,
      outT:lo?tShort(lo.outAt):'', outBy:lo?lo.outBy:'', outQr:!!(lo&&lo.outMethod==='qr'), outSig:lo?allSigs[lo.id+':out']:null};
  }));
}
function sigCell(sig,name,qr){ if(validSig(sig)) return sigSvg(sig); if(name) return `<span class="typed">${esc(name)}</span>${qr?' <span class="pill qr">QR</span>':''}`; return ''; }
async function viewSheets(k,kidSel){
  const all=await sigs.all();
  const kids=kidSel==='__all'?state.children.filter(c=>c.status==='active').sort(byName):[childById(kidSel)].filter(Boolean);
  const title=(state.settings.org||"Chavelita's Child Care").toUpperCase();
  const html=kids.map(c=>{ const rows=sheetRows(c.id,k,all);
    return `<div class="paper"><div class="paper-title">${esc(title)}</div>
      <div class="paper-meta"><span>CHILD NAME <u>${esc(c.first+' '+c.last)}</u></span><span>${esc(periodLabel(k))}</span></div>
      <div class="tablewrap"><table class="paper-t"><thead><tr><th>DATE</th><th>TIME IN</th><th>PARENT SIGNATURE</th><th>TIME OUT</th><th>PARENT SIGNATURE</th></tr></thead>
      <tbody>${rows.map((wk,wi)=>(wi?'<tr class="gap"><td colspan="5"></td></tr>':'')+wk.map(r=>r.absent?`<tr><td class="num">${shortMD(r.day)}</td><td colspan="4" class="abs">ABSENT</td></tr>`:
        `<tr><td class="num">${shortMD(r.day)}</td><td class="num">${esc(r.inT)}</td><td>${sigCell(r.inSig,r.inBy,r.inQr)}</td><td class="num">${esc(r.outT)}</td><td>${sigCell(r.outSig,r.outBy,r.outQr)}</td></tr>`).join('')).join('')}</tbody></table></div></div>`; }).join('');
  sheet(`<header><h3>${esc(t('sheets'))} · ${esc(periodLabel(k))}</h3><button class="btn sm" data-close>✕</button></header>${html||`<div class="empty">${esc(t('noActive'))}</div>`}<button class="btn primary block" id="sh-pdf2">⇩ ${esc(t('sheetPdf'))}</button>`,h=>{ $('#sh-pdf2',h).onclick=()=>exportSheetsPdf(k,kidSel); });
}
// signature -> PNG for the PDF, fitted into a w x h box (points), drawn at 4x for print sharpness
function sigPng(g,w,h){ const [bx,by,bw,bh]=sigBox(g); const S=4, cv=document.createElement('canvas'); cv.width=Math.round(w*S); cv.height=Math.round(h*S);
  const ctx=cv.getContext('2d'); const sc=Math.min(cv.width/bw,cv.height/bh); const ox=(cv.width-bw*sc)/2, oy=(cv.height-bh*sc)/2;
  ctx.setTransform(sc,0,0,sc,ox-bx*sc,oy-by*sc); ctx.lineWidth=Math.max(1.6,3.2/sc); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#1d2b6b'; ctx.stroke(new Path2D(g.d));
  return cv.toDataURL('image/png'); }
async function exportSheetsPdf(k,kidSel){
  toast(t('preparing'));
  try{ await loadLib('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',()=>window.jspdf&&window.jspdf.jsPDF); }catch(err){ toast(t('exportFail')); return; }
  const all=await sigs.all();
  const kids=kidSel==='__all'?state.children.filter(c=>c.status==='active').sort(byName):[childById(kidSel)].filter(Boolean);
  if(!kids.length){ toast(t('noActive')); return; }
  const doc=new window.jspdf.jsPDF({unit:'pt',format:'letter'}); const M=40, W=612-2*M;
  const cols=[54,68,170,68,172]; const xs=cols.reduce((a,c,i)=>(a.push((a[i-1]||M)+(i?cols[i-1]:0)),a),[]).map((x,i)=>i?x:M);
  const title=(state.settings.org||"Chavelita's Child Care").toUpperCase(), blue=[31,104,176];
  kids.forEach((c,ci)=>{ if(ci) doc.addPage();
    const rows=sheetRows(c.id,k,all);
    doc.setTextColor(...blue); doc.setFont('times','bold'); doc.setFontSize(24); doc.text(title,306,62,{align:'center'});
    doc.setFontSize(13); doc.text('CHILD NAME',M,100); const nx=M+doc.getTextWidth('CHILD NAME ')+2;
    doc.setTextColor(30,30,40); doc.setFont('times','normal'); doc.text(c.first+' '+c.last,nx+4,98); doc.setDrawColor(...blue); doc.setLineWidth(.8); doc.line(nx,101,nx+190,101);
    doc.setTextColor(...blue); doc.setFont('times','bold'); doc.text(periodLabel(k),M+W,100,{align:'right'});
    let y=118; const rh=22, hh=22; doc.setDrawColor(90,90,100); doc.setLineWidth(.6); doc.setTextColor(30,30,40); doc.setFontSize(9.5);
    ['DATE','TIME IN','PARENT SIGNATURE','TIME OUT','PARENT SIGNATURE'].forEach((hd,i)=>{ doc.rect(xs[i],y,cols[i],hh); doc.text(hd,xs[i]+cols[i]/2,y+14.5,{align:'center'}); }); y+=hh;
    rows.forEach((wk,wi)=>{ if(wi) y+=12;
      wk.forEach(r=>{ doc.setFont('times','normal'); doc.setFontSize(11); doc.setTextColor(30,30,40);
        cols.forEach((w,i)=>doc.rect(xs[i],y,w,rh));
        doc.text(shortMD(r.day),xs[0]+6,y+15);
        if(r.absent){ doc.setTextColor(140,140,150); doc.setFont('times','italic'); doc.text('ABSENT',xs[1]+6,y+15); }
        else{
          if(r.inT) doc.text(r.inT,xs[1]+6,y+15);
          if(r.outT) doc.text(r.outT,xs[3]+6,y+15);
          [[r.inSig,r.inBy,r.inQr,2],[r.outSig,r.outBy,r.outQr,4]].forEach(([g,name,qr,i])=>{
            if(validSig(g)){ try{ doc.addImage(sigPng(g,cols[i]-10,rh-4),'PNG',xs[i]+5,y+2,cols[i]-10,rh-4); }catch(e){} }
            else if(name){ doc.setFont('times','italic'); doc.setFontSize(11); doc.text(name+(qr?'  (QR)':''),xs[i]+6,y+15,{maxWidth:cols[i]-10}); doc.setFont('times','normal'); }
          });
        }
        y+=rh; }); });
    doc.setFontSize(8); doc.setTextColor(140,140,150); doc.setFont('helvetica','normal');
    doc.text(`Entrada · ${new Date().toLocaleDateString('en-US')}`,M,770);
  });
  const who=kids.length===1?(kids[0].first+'-'+kids[0].last).replace(/[^\w-]+/g,''):'todos';
  offerFile(`hoja-firmas-${periodDays(k)[0][0]}-${who}.pdf`,doc.output('blob'),'application/pdf');
}
